<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasmine's Toolbox</title>
</head>

<body>
    <header>
        <h1>Jasmine's Toolbox</h1>
        <p>让生活简单一点的小工具箱。</p>
    </header>

    <main>
      <section>
        <h2>今天吃什么</h2>
        <p>选择困难时，让我帮你决定。</p>
        <button type="button">随机选择</button>
      </section>

      <section>
      <h2>待办清单</h2>
      <input type="text" placeholder="写下一件要做的事">
      <button type="button">添加</button>
      </section>

      <section>
      <h2>目标倒计时</h2>
      <p>距离目标还有 -- 天</p>
      </section>
    </main>
</body>
</html>
